version = 1
revision = 3
requires-python = ">=3.12"

[[package]]
name = "ladybom-uv-synthetic"
version = "0.1.0"
source = { virtual = "." }
dependencies = [{ name = "interop-python-right", marker = "sys_platform == 'linux'" }]

[package.optional-dependencies]
extra = [{ name = "interop-python-leaf" }]

[[package]]
name = "interop-python-right"
version = "1.0.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [{ name = "interop-python-leaf", marker = "python_full_version >= '3.12'" }]

[[package]]
name = "interop-python-leaf"
version = "1.0.0"
source = { registry = "https://pypi.org/simple" }
