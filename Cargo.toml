[workspace]
members = ["crates/ladyshell", "crates/ladybom", "crates/ladybom-cli", "crates/ladybom-graph", "crates/ladyboot", "crates/ladyhost"]
resolver = "2"

[package]
license = "Apache-2.0 AND MIT"
name = "ladyshell-cli"
default-run = "ladyshell"
version = "0.1.0"
edition = "2021"
description = "Run authorized OpenShell tasks and retain their execution evidence"
repository = "https://github.com/f1b0-gh/lady"
readme = "docs/ladyshell-cli.md"
include = ["/src/**", "/tests/**", "/examples/source_snapshot.rs", "/Cargo.toml", "/Cargo.lock", "/docs/ladyshell-cli.md", "/LICENSE", "/LICENSE-MIT"]

[[bin]]
name = "ladyshell"
path = "src/main.rs"

[[bin]]
name = "audit-validator"
path = "src/bin/audit-validator.rs"

[dependencies]
ladyshell = { version = "=0.1.0", path = "crates/ladyshell" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ladybom.workspace = true
ladybom-graph.workspace = true
sha2.workspace = true
tempfile = "3"
libc = "0.2"
tar = "0.4"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.dependencies]
nickel-util = "=0.1.0"
sha2 = "0.10"
# Ladyhost reuses the qualified registry pins; other members retain their
# existing feature selections and resolve compatible versions through Cargo.lock.
jjpr = "=0.45.1"
anyhow = "=1.0.104"
serde = "=1.0.229"
serde_json = "=1.0.154"

# Keep the standalone Unicode table selection in Cargo.lock. Embedding hosts
# may select a compatible patch; their lock and validator tests own that choice.
unicode-normalization = "0.1.25"
ryu-js = "1.0"

ladybom = { version = "=0.1.0", path = "crates/ladybom", default-features = false }
ladybom-graph = { version = "=0.1.0", path = "crates/ladybom-graph" }
time = { version = "0.3", features = ["formatting", "parsing"] }
packageurl = "0.6"
semver = "1"
node-semver = "2"
pep440_rs = "0.7"
tempfile = "3"
libc = "0.2"
