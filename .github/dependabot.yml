version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
    # Fixtures are synthetic; the Nickeling bundle is updated from upstream.
    exclude-paths:
      - "**/fixtures/**"
      - "vendor/**"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
