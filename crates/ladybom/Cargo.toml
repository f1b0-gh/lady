[package]
license = "Apache-2.0"
name = "ladybom"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2.workspace = true
nickel-util.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
jsonschema = { version = "=0.60.2", default-features = false }
cargo-lock = "10.1"
cyclonedx-bom = "0.8.1"
time.workspace = true
packageurl.workspace = true
pep508_rs = "0.9.2"
toml = "0.8"
globset = "0.4"
semver.workspace = true
node-semver.workspace = true
pep440_rs.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
