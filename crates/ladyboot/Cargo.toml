[package]
license = "Apache-2.0"
name = "ladyboot"
version = "0.1.0"
edition = "2021"
default-run = "ladyboot"

[dependencies]
nickel-util.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
tempfile = "3"
clap = { version = "4", features = ["derive"], optional = true }

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "ladyboot"
path = "src/main.rs"
required-features = ["cli"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
