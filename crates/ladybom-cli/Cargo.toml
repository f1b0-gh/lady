[package]
license = "Apache-2.0"
name = "ladybom-cli"
version = "0.1.0"
edition = "2021"
description = "Inventory source dependencies, export SBOMs, and inspect dependency graphs"
repository = "https://github.com/f1b0-gh/lady"
readme = "README.md"

[[bin]]
name = "ladybom"
path = "src/main.rs"

[features]
default = ["graph"]
graph = ["dep:ladybom-graph"]

[dependencies]
ladybom.workspace = true
ladybom-graph = { workspace = true, optional = true }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
