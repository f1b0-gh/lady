[package]
license = "Apache-2.0"
name = "ladybom-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ladybom"
path = "src/main.rs"

[dependencies]
ladybom = { path = "../ladybom", features = ["graph"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
